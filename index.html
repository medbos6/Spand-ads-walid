<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل مصروف الإعلانات</title>
<meta name="theme-color" content="#FCF3D4">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ati">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروف الإعلانات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FCF3D4;
    --surface:#FFFDF7;
    --surface-2:#FBF6E6;
    --line:#EADFBF;
    --text:#2A2110;
    --muted:#8C7F5E;
    --gold:#7A5200;
    --mint:#146B47;
    --danger:#B3261E;
    --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:calc(14px + env(safe-area-inset-top)) 12px calc(60px + env(safe-area-inset-bottom));
    background:var(--ink);color:var(--text);
    font-family:var(--ar);font-size:15px;line-height:1.5;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-feature-settings:"zero" 0;direction:ltr;display:inline-block}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(122,82,0,.08)}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .card-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.3px}

  /* ---- hero ---- */
  .hero{background:linear-gradient(160deg,#FFFCF1 0%,#FFFBEF 100%)}
  .grand{font-size:34px;font-weight:600;color:var(--gold);letter-spacing:-1px}
  .grand small{font-size:16px;color:#9A7326;margin-inline-end:4px}
  .ribbon{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#F3EBD2;margin-top:14px;gap:2px}
  .ribbon i{display:block;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .ribbon.empty{background:repeating-linear-gradient(45deg,#F7EFD9,#F7EFD9 6px,#F0E7CD 6px,#F0E7CD 12px)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .stat u{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .stat b{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.4px}
  .stat b small{font-size:11.5px;color:var(--muted);margin-inline-end:3px}
  .stat.hot b{color:var(--gold)}
  .stat i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:3px}
  .range{
    display:flex;gap:6px;margin-top:14px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch
  }
  .range::-webkit-scrollbar{display:none}
  .range button{
    flex:0 0 auto;padding:8px 13px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;
    background:transparent;color:var(--muted);font-family:var(--ar);font-size:12.5px;cursor:pointer
  }
  .range button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#FFFCF1;font-weight:600}

  /* ---- entry ---- */
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .datebar button{
    width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-size:17px;cursor:pointer
  }
  .datebar button:disabled{opacity:.35}
  .dateface{flex:1;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:7px 4px;position:relative}
  .dateface span{display:block;font-size:14px;font-weight:600}
  .dateface em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
  .dateface input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}

  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #EFE6CC}
  .row:last-of-type{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .cname{flex:1;font-size:14.5px;font-weight:500}
  .cname b{display:block;font-weight:400;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .field{position:relative;width:118px;flex:none}
  .field span{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;font-family:var(--mono);pointer-events:none}
  .field input{
    width:100%;padding:11px 10px 11px 30px;text-align:end;
    background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
    color:var(--text);font-family:var(--mono);font-size:15px;font-weight:600;
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  .field input.filled{border-color:#8FBF9A;background:#EDF6E4}

  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;min-height:18px}
  .status.ok{color:var(--mint)}
  .status.err{color:var(--danger)}

  /* ---- totals ---- */
  .tot{margin-bottom:11px}
  .tot .line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
  .tot .nm{font-size:14px}
  .tot .vl{font-family:var(--mono);font-size:14.5px;font-weight:600}
  .tot .meta{font-size:11px;color:var(--muted)}
  .track{height:7px;border-radius:99px;background:#F3EBD2;overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

  /* ---- history ---- */
  .hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #EFE6CC}
  .hrow:last-child{border-bottom:0}
  .hrow .d{flex:1;font-size:13.5px}
  .hrow .d em{font-style:normal;display:block;font-size:11px;color:var(--muted)}
  .hrow .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--gold)}
  .hrow .go{background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--muted);width:32px;height:32px;cursor:pointer;font-size:14px}
  .empty-state{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px}

  .tools{display:flex;gap:8px}
  .tools button{
    flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--text);font-family:var(--ar);font-size:13px;cursor:pointer
  }
  .tools button.warn{color:var(--danger);border-color:#E8C3B4}
  select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:6px 8px;font-family:var(--ar);font-size:12.5px
  }
  textarea{
    width:100%;height:150px;margin-top:10px;background:#F3EBD2;border:1px solid var(--line);
    border-radius:12px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:10px;direction:ltr
  }
  .cur{
    font-family:var(--mono);font-size:14.5px;font-weight:600;min-width:62px;text-align:center;
    color:var(--muted);flex:none;cursor:pointer;padding:7px 6px;
    background:transparent;border:1px dashed #D9CBA0;border-radius:10px;
    -webkit-appearance:none;appearance:none
  }
  .cur.has{color:var(--mint);border-color:#8FBF9A;border-style:solid;background:#EDF6E4}
  .daytotal{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;padding:12px 13px;border-radius:13px;
    background:var(--surface-2);border:1px solid var(--line);font-size:14px
  }
  .daytotal b{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--gold)}
  .daytotal i{font-style:normal;color:var(--mint);font-size:13px;margin-inline-start:6px}
  .save{
    width:100%;margin-top:10px;padding:14px;border-radius:13px;border:0;
    background:var(--gold);color:#FFFCF1;font-family:var(--ar);font-size:15.5px;font-weight:700;cursor:pointer
  }
  .save:disabled{background:#F0E7CD;color:#AA9C78;cursor:default}
  .undo{
    width:100%;margin-top:8px;padding:9px;border-radius:11px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:var(--ar);font-size:12.5px;cursor:pointer
  }
  .tot{cursor:pointer}
  .tot .nm .chev{color:#C4B588;font-size:12px;margin-inline-start:4px}

  .sheet{position:fixed;inset:0;z-index:50;background:rgba(42,33,16,.45);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .sheet-in{
    width:100%;max-height:86vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:16px 14px calc(22px + env(safe-area-inset-bottom))
  }
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .sheet-head>div{font-size:16px;font-weight:700}
  .sheet-head button{
    width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--muted);font-size:15px;cursor:pointer
  }
  .kpis{display:flex;gap:8px;margin:12px 0 14px}
  .kpi{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  .kpi u{display:block;text-decoration:none;font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .kpi b{font-family:var(--mono);font-size:14.5px;font-weight:600}
  .drow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #EFE6CC}
  .drow:last-child{border-bottom:0}
  .drow .dd{flex:none;width:74px;font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr;text-align:start}
  .drow .db{flex:1;height:8px;border-radius:99px;background:#F3EBD2;overflow:hidden}
  .drow .db i{display:block;height:100%;border-radius:99px}
  .drow .dv{flex:none;font-family:var(--mono);font-size:13.5px;font-weight:600;min-width:62px;text-align:end}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card hero">
  <div class="card-head">
    <div>
      <h1>سجل مصروف الإعلانات</h1>
      <div class="sub" id="rangeLabel">كل الفترة</div>
    </div>
    <select id="cur" aria-label="العملة">
      <option value="USD">$ USD</option>
      <option value="EUR">€ EUR</option>
      <option value="SAR">ر.س SAR</option>
      <option value="PLN">zł PLN</option>
      <option value="TON">TON</option>
    </select>
  </div>
  <div class="grand"><small id="curSym">$</small><span class="num" id="grand">0.00</span></div>
  <div class="ribbon empty" id="ribbon"></div>
  <div class="range">
    <button data-range="today">اليوم</button>
    <button data-range="week">الأسبوع</button>
    <button data-range="month">هذا الشهر</button>
    <button data-range="lastmonth">الشهر الماضي</button>
    <button data-range="year">السنة</button>
    <button data-range="all" aria-pressed="true">الكل</button>
  </div>
</div>

<div class="card">
  <div class="card-head"><div class="card-title">ملخص الصرف</div></div>
  <div class="stats" id="stats"></div>
</div>

<div class="card">
  <div class="card-head"><div class="card-title">إدخال مصروف اليوم</div></div>
  <div class="datebar">
    <button id="prev" aria-label="اليوم السابق">›</button>
    <label class="dateface">
      <span id="dLabel">—</span>
      <em id="dSub">—</em>
      <input type="date" id="dInput">
    </label>
    <button id="next" aria-label="اليوم التالي">‹</button>
  </div>
  <div id="rows"></div>
  <div class="daytotal">
    <span>مجموع اليوم</span>
    <b id="dayTotalWrap"><span id="daySym">$</span> <span class="num" id="dayTotal">0.00</span><i id="dayPending"></i></b>
  </div>
  <button id="saveBtn" class="save" disabled>حفظ</button>
  <div class="status" id="status"></div>
  <button id="undo" class="undo" hidden></button>
</div>

<div class="card">
  <div class="card-head">
    <div class="card-title">الإجمالي لكل دولة</div>
    <div class="card-title num" id="daysCount"></div>
  </div>
  <div id="totals"></div>
</div>

<div class="card">
  <div class="card-head"><div class="card-title">آخر الأيام المسجّلة</div></div>
  <div id="history"></div>
</div>

<div class="card">
  <div class="tools">
    <button id="dl">تنزيل CSV</button>
    <button id="exp">نسخ CSV</button>
    <button id="bak">نسخة احتياطية</button>
  </div>
  <div class="tools" style="margin-top:8px">
    <button id="wipe" class="warn">مسح كل البيانات</button>
  </div>
  <textarea id="csv" hidden readonly></textarea>
  <div id="bakBox" hidden>
    <div class="sub" style="margin-top:10px">انسخ هذا النص واحفظه عندك. للاستعادة: الصق النص هنا ثم اضغط «استعادة».</div>
    <textarea id="bakText" spellcheck="false"></textarea>
    <div class="tools"><button id="restore">استعادة من النص</button></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <div id="sheetTitle">—</div>
      <button id="sheetClose" aria-label="إغلاق">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

function todayKey(d){
  const t = d || new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function shift(key, n){
  const [y,m,d] = key.split('-').map(Number);
  const t = new Date(y, m-1, d+n);
  return todayKey(t);
}
function fmt(n){ return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function niceDate(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long', day:'numeric', month:'long'}).format(new Date(y,m-1,d));
}

/* ---------- storage ---------- */
function adopt(raw){
  if(!raw) return false;
  try{
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(parsed && typeof parsed === 'object' && parsed.entries){
      state.currency = parsed.currency || 'USD';
      state.entries = parsed.entries || {};
      state.log = Array.isArray(parsed.log) ? parsed.log : [];
      return true;
    }
  }catch(e){}
  return false;
}
async function load(){
  let done = false;
  try{
    const r = await window.storage.get(KEY, false);
    if(r && r.value) done = adopt(r.value);
  }catch(e){}
  if(!done){
    try{ done = adopt(localStorage.getItem(KEY)); }catch(e){}
  }
}
function queueSave(){
  setStatus('جارٍ الحفظ…','');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 500);
}
async function persist(){
  const payload = JSON.stringify(state);
  let cloud = false, local = false;
  try{ cloud = !!(await window.storage.set(KEY, payload, false)); }catch(e){}
  try{ localStorage.setItem(KEY, payload); local = true; }catch(e){}

  if(cloud) setStatus('تم الحفظ ✓','ok');
  else if(local) setStatus('تم الحفظ على هذا الجهاز ✓','ok');
  else setStatus('تعذّر الحفظ — انسخ النسخة الاحتياطية أسفل الصفحة','err');
}
function setStatus(txt, cls){
  const el = document.getElementById('status');
  el.textContent = txt; el.className = 'status ' + (cls||'');
}

/* ---------- data helpers ---------- */
function periodRange(p){
  const t = todayKey();
  if(p === 'today') return {from:t, to:t};
  if(p === 'week')  return {from:shift(t,-6), to:t};
  if(p === 'month') return {from:t.slice(0,7) + '-01', to:t};
  if(p === 'lastmonth'){
    const y = Number(t.slice(0,4)), m = Number(t.slice(5,7));
    const ly = m === 1 ? y - 1 : y;
    const lm = m === 1 ? 12 : m - 1;
    const mm = String(lm).padStart(2,'0');
    const last = new Date(ly, lm, 0).getDate();
    return {from:`${ly}-${mm}-01`, to:`${ly}-${mm}-${String(last).padStart(2,'0')}`};
  }
  if(p === 'year') return {from:t.slice(0,4) + '-01-01', to:t};
  return {from:'0000-01-01', to:'9999-12-31'};
}
function inRange(key, p){
  const r = periodRange(p || range);
  return key >= r.from && key <= r.to;
}
function totals(p){
  const out = {}; let grand = 0, days = 0;
  COUNTRIES.forEach(c => out[c.id] = {sum:0, days:0});
  Object.keys(state.entries).forEach(k=>{
    if(!inRange(k, p)) return;
    const rec = state.entries[k]; let any = false;
    COUNTRIES.forEach(c=>{
      const v = Number(rec[c.id]);
      if(rec[c.id] !== undefined && rec[c.id] !== '' && !isNaN(v)){
        out[c.id].sum += v; out[c.id].days++; grand += v; any = true;
      }
    });
    if(any) days++;
  });
  return {out, grand, days};
}

/* ---------- rendering ---------- */
function pendingSum(){
  let sum = 0;
  document.querySelectorAll('#rows input').forEach(i=>{ sum += Math.max(0, Number(i.value) || 0); });
  return sum;
}
function refreshPending(){
  const p = pendingSum();
  const btn = document.getElementById('saveBtn');
  btn.disabled = p <= 0;
  btn.textContent = p > 0 ? `حفظ  +${SYM[state.currency]} ${fmt(p)}` : 'حفظ';
  document.getElementById('dayPending').textContent = p > 0 ? `+${fmt(p)}` : '';
}
function dayTotal(key){
  const rec = state.entries[key] || {};
  return COUNTRIES.reduce((a,c)=> a + (Number(rec[c.id]) || 0), 0);
}
function renderDayTotal(){
  document.getElementById('daySym').textContent = SYM[state.currency];
  document.getElementById('dayTotal').textContent = fmt(dayTotal(day));
  refreshPending();
}

function renderRows(){
  const rec = state.entries[day] || {};
  document.getElementById('rows').innerHTML = COUNTRIES.map(c=>{
    const v = Number(rec[c.id]) || 0;
    return `<div class="row">
      <i class="dot" style="background:${c.color}"></i>
      <div class="cname">${c.flag} ${c.name}<b>${c.code}</b></div>
      <button class="cur ${v?'has':''}" data-edit="${c.id}" title="تعديل المبلغ المسجّل">${v ? fmt(v) : '—'}</button>
      <label class="field">
        <span>+</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"
               data-c="${c.id}" aria-label="إضافة مبلغ إلى ${c.name}">
      </label>
    </div>`;
  }).join('');

  const box = document.getElementById('rows');
  box.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.classList.toggle('filled', inp.value.trim() !== '');
      refreshPending();
    });
  });
  box.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.edit;
      const c = COUNTRIES.find(x=>x.id===id);
      const cur = Number((state.entries[day]||{})[id]) || 0;
      const val = prompt(`المبلغ الإجمالي المسجّل لـ${c.name} في ${day}:`, cur ? String(cur) : '');
      if(val === null) return;
      const t = val.trim();
      if(!state.entries[day]) state.entries[day] = {};
      if(t === '' || Number(t) <= 0) delete state.entries[day][id];
      else state.entries[day][id] = Number(t) || 0;
      if(Object.keys(state.entries[day]).length === 0) delete state.entries[day];
      persist(); renderAll();
    });
  });
  renderDayTotal();
}

function commit(){
  const adds = [];
  document.querySelectorAll('#rows input').forEach(inp=>{
    const v = Number(inp.value);
    if(inp.value.trim() !== '' && v > 0) adds.push({c: inp.dataset.c, v});
  });
  if(!adds.length) return;

  if(!state.entries[day]) state.entries[day] = {};
  adds.forEach(a=>{
    state.entries[day][a.c] = (Number(state.entries[day][a.c]) || 0) + a.v;
  });
  state.log.push({d: day, adds, ts: Date.now()});
  if(state.log.length > 200) state.log = state.log.slice(-200);

  persist();
  renderAll();
  const total = adds.reduce((a,x)=>a+x.v,0);
  setStatus(`تمت إضافة ${SYM[state.currency]} ${fmt(total)} إلى ${day} ✓`, 'ok');
}

function renderUndo(){
  const btn = document.getElementById('undo');
  const last = state.log[state.log.length-1];
  if(!last){ btn.hidden = true; return; }
  const total = last.adds.reduce((a,x)=>a+x.v,0);
  btn.hidden = false;
  btn.textContent = `↩ تراجع عن آخر إضافة (${SYM[state.currency]} ${fmt(total)} · ${last.d})`;
}

function renderDate(){
  document.getElementById('dLabel').textContent = niceDate(day);
  const isToday = day === todayKey();
  document.getElementById('dSub').textContent = isToday ? 'اليوم · ' + day : day;
  document.getElementById('dInput').value = day;
  document.getElementById('next').disabled = isToday;
}

function renderStats(){
  const defs = [
    {p:'today',     label:'اليوم', hot:true},
    {p:'week',      label:'آخر ٧ أيام'},
    {p:'month',     label:'هذا الشهر'},
    {p:'lastmonth', label:'الشهر الماضي'},
    {p:'year',      label:'هذه السنة'},
    {p:'all',       label:'كل الفترة'}
  ];
  document.getElementById('stats').innerHTML = defs.map(d=>{
    const t = totals(d.p);
    const avg = t.days ? t.grand / t.days : 0;
    const note = d.p === 'today'
      ? (t.days ? 'مسجّل اليوم' : 'لا يوجد صرف اليوم')
      : (t.days ? `${t.days} يوم · متوسط ${fmt(avg)}` : 'لا يوجد صرف');
    return `<div class="stat ${d.hot?'hot':''}">
      <u>${d.label}</u>
      <b><small>${SYM[state.currency]}</small><span class="num">${fmt(t.grand)}</span></b>
      <i>${note}</i>
    </div>`;
  }).join('');
}

function renderSummary(){
  renderStats();
  const {out, grand, days} = totals();
  document.getElementById('curSym').textContent = SYM[state.currency];
  document.getElementById('grand').textContent = fmt(grand);
  document.getElementById('daysCount').textContent = days ? days + ' يوم' : '';

  const ribbon = document.getElementById('ribbon');
  if(grand <= 0){ ribbon.className = 'ribbon empty'; ribbon.innerHTML=''; }
  else{
    ribbon.className = 'ribbon';
    ribbon.innerHTML = COUNTRIES.map(c=>{
      const w = out[c.id].sum / grand * 100;
      return w > 0 ? `<i style="width:${w}%;background:${c.color}" title="${c.name}"></i>` : '';
    }).join('');
  }

  const max = Math.max(...COUNTRIES.map(c=>out[c.id].sum), 0);
  document.getElementById('totals').innerHTML = COUNTRIES.map(c=>{
    const t = out[c.id];
    const share = grand > 0 ? Math.round(t.sum/grand*100) : 0;
    const avg = t.days ? t.sum/t.days : 0;
    return `<div class="tot" data-open="${c.id}">
      <div class="line">
        <div class="nm">${c.flag} ${c.name} <span class="meta">${share}%</span><span class="chev">›</span></div>
        <div class="vl" style="color:${t.sum?c.color:'#AA9C78'}">${SYM[state.currency]} <span class="num">${fmt(t.sum)}</span></div>
      </div>
      <div class="track"><i style="width:${max? (t.sum/max*100):0}%;background:${c.color}"></i></div>
      <div class="meta" style="margin-top:4px">${t.days ? `${t.days} يوم · متوسط ${SYM[state.currency]} ${fmt(avg)} لليوم` : 'لا يوجد صرف مسجّل'}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openCountry(el.dataset.open));
  });
}

const PERIOD_LABEL = {today:'اليوم', week:'آخر ٧ أيام', month:'هذا الشهر', lastmonth:'الشهر الماضي', year:'هذه السنة', all:'كل الفترة'};

function openCountry(id){
  const c = COUNTRIES.find(x=>x.id===id);
  const rows = Object.keys(state.entries)
    .filter(k=> inRange(k) && Number(state.entries[k][id]) > 0)
    .sort().reverse()
    .map(k=>({k, v: Number(state.entries[k][id])}));

  const sum = rows.reduce((a,r)=>a+r.v, 0);
  const max = rows.reduce((a,r)=>Math.max(a,r.v), 0);
  const avg = rows.length ? sum/rows.length : 0;

  document.getElementById('sheetTitle').textContent = `${c.flag} ${c.name} · ${PERIOD_LABEL[range]}`;
  document.getElementById('sheetBody').innerHTML = `
    <div class="kpis">
      <div class="kpi"><u>الإجمالي</u><b style="color:${c.color}">${SYM[state.currency]} ${fmt(sum)}</b></div>
      <div class="kpi"><u>عدد الأيام</u><b>${rows.length}</b></div>
      <div class="kpi"><u>متوسط اليوم</u><b>${fmt(avg)}</b></div>
    </div>
    ${rows.length ? rows.map(r=>`
      <div class="drow">
        <div class="dd">${r.k}</div>
        <div class="db"><i style="width:${max? (r.v/max*100):0}%;background:${c.color}"></i></div>
        <div class="dv" style="color:${c.color}">${fmt(r.v)}</div>
      </div>`).join('')
      : '<div class="empty-state">لا يوجد صرف مسجّل لهذه الدولة في هذه الفترة.</div>'}
  `;
  document.getElementById('sheet').hidden = false;
}

function closeSheet(){ document.getElementById('sheet').hidden = true; }
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheet').addEventListener('click', e=>{ if(e.target.id === 'sheet') closeSheet(); });

function renderHistory(){
  const keys = Object.keys(state.entries).sort().reverse().slice(0,30);
  const box = document.getElementById('history');
  if(!keys.length){ box.innerHTML = '<div class="empty-state">لا توجد أيام مسجّلة بعد. ابدأ بإدخال مبالغ اليوم في الأعلى.</div>'; return; }
  box.innerHTML = keys.map(k=>{
    const rec = state.entries[k];
    const sum = COUNTRIES.reduce((a,c)=> a + (Number(rec[c.id])||0), 0);
    const chips = COUNTRIES.filter(c=>rec[c.id] !== undefined && rec[c.id] !== '').map(c=>c.flag).join(' ');
    return `<div class="hrow">
      <div class="d">${niceDate(k)}<em>${k} · ${chips}</em></div>
      <div class="v">${SYM[state.currency]} <span class="num">${fmt(sum)}</span></div>
      <button class="go" data-k="${k}" aria-label="فتح ${k}">✎</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.go').forEach(b=>b.addEventListener('click', ()=>{
    day = b.dataset.k; renderDate(); renderRows(); setStatus('','');
    window.scrollTo({top:0, behavior:'smooth'});
  }));
}

function renderAll(){ renderDate(); renderRows(); renderSummary(); renderHistory(); renderUndo(); }

/* ---------- controls ---------- */
document.getElementById('saveBtn').addEventListener('click', commit);

document.getElementById('undo').addEventListener('click', ()=>{
  const last = state.log.pop();
  if(!last) return;
  const rec = state.entries[last.d];
  if(rec){
    last.adds.forEach(a=>{
      const left = (Number(rec[a.c]) || 0) - a.v;
      if(left > 0.0001) rec[a.c] = Math.round(left*100)/100; else delete rec[a.c];
    });
    if(Object.keys(rec).length === 0) delete state.entries[last.d];
  }
  persist(); renderAll();
  setStatus('تم التراجع','ok');
});

document.getElementById('prev').addEventListener('click', ()=>{ day = shift(day,-1); renderDate(); renderRows(); setStatus('',''); });
document.getElementById('next').addEventListener('click', ()=>{ if(day < todayKey()){ day = shift(day,1); renderDate(); renderRows(); setStatus('',''); } });
document.getElementById('dInput').addEventListener('change', e=>{ if(e.target.value){ day = e.target.value; renderDate(); renderRows(); setStatus('',''); } });

document.querySelectorAll('.range button').forEach(b=>{
  b.addEventListener('click', ()=>{
    range = b.dataset.range;
    document.querySelectorAll('.range button').forEach(x=>x.setAttribute('aria-pressed', x===b ? 'true':'false'));
    document.getElementById('rangeLabel').textContent = b.textContent;
    renderSummary();
  });
});

document.getElementById('cur').addEventListener('change', e=>{
  state.currency = e.target.value;
  queueSave(); renderAll();
});

function buildCsv(){
  const lines = ['date,' + COUNTRIES.map(c=>c.code).join(',') + ',total'];
  Object.keys(state.entries).sort().forEach(k=>{
    const rec = state.entries[k];
    const vals = COUNTRIES.map(c=> rec[c.id] !== undefined && rec[c.id] !== '' ? Number(rec[c.id]).toFixed(2) : '');
    const sum = COUNTRIES.reduce((a,c)=> a + (Number(rec[c.id])||0), 0);
    lines.push([k, ...vals, sum.toFixed(2)].join(','));
  });
  return lines.join('\n');
}

document.getElementById('exp').addEventListener('click', ()=>{
  const ta = document.getElementById('csv');
  ta.value = buildCsv();
  ta.hidden = !ta.hidden;
  if(!ta.hidden){ ta.focus(); ta.select(); }
});

document.getElementById('dl').addEventListener('click', ()=>{
  try{
    const blob = new Blob(['\ufeff' + buildCsv()], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ad-spend-${todayKey()}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    const ta = document.getElementById('csv');
    ta.value = buildCsv(); ta.hidden = false; ta.focus(); ta.select();
  }
});

document.getElementById('bak').addEventListener('click', ()=>{
  const box = document.getElementById('bakBox');
  document.getElementById('bakText').value = JSON.stringify(state);
  box.hidden = !box.hidden;
});

document.getElementById('restore').addEventListener('click', async ()=>{
  const txt = document.getElementById('bakText').value.trim();
  if(!adopt(txt)){ setStatus('النص غير صالح — تأكد من نسخه كاملاً','err'); return; }
  await persist();
  document.getElementById('cur').value = state.currency;
  renderAll();
  setStatus('تمت الاستعادة ✓','ok');
});

document.getElementById('wipe').addEventListener('click', async ()=>{
  if(!confirm('سيتم حذف كل المبالغ المسجّلة لكل الدول. هل تريد المتابعة؟')) return;
  state.entries = {};
  await persist();
  renderAll();
});

/* ---------- boot ---------- */
(async ()=>{
  await load();
  document.getElementById('cur').value = state.currency;
  renderAll();
})();
</script>
</body>
</html>
